---

- name: "Nextcloud configure: set Nextcloud directory"
  ansible.builtin.set_fact:
    __nextcloud_install_dir: "{{ nextcloud_dl_tmp_dir + '/nextcloud' if (__nextcloud_do_install | bool or __nextcloud_do_upgrade | bool) else nextcloud_instance }}"

- name: "Nextcloud configure: copy skeleton directory"
  ansible.builtin.copy:
    src: "nextcloud/skeleton/"
    dest: "{{ nextcloud_config.system.skeletondirectory }}"
    owner: "{{ nextcloud_http_user }}"
    group: "{{ nextcloud_http_group }}"
    mode: 0640
    directory_mode: 0750
  when:
    - nextcloud_config.system.skeletondirectory is defined
    - nextcloud_config.system.skeletondirectory != ""

- name: "Nextcloud configure: copy theme"
  ansible.builtin.copy:
    src: "nextcloud/themes/{{ nextcloud_config.system.theme }}"
    dest: "{{ __nextcloud_install_dir }}/themes/"
    owner: "{{ nextcloud_http_user }}"
    group: "{{ nextcloud_http_group }}"
    mode: 0640
    directory_mode: 0750
  when: nextcloud_config.system.theme is defined

- name: "Nextcloud configure: copy custom apps"
  ansible.builtin.copy:
    src: "nextcloud/apps/{{ item }}"
    dest: "{{ __nextcloud_install_dir }}/apps/"
    owner: "{{ nextcloud_http_user }}"
    group: "{{ nextcloud_http_group }}"
    mode: 0640
    directory_mode: 0750
  with_items:
    - "{{ nextcloud_custom_apps }}"

- name: "Nextcloud configure: enable custom apps"
  become: True
  become_user: "{{ nextcloud_http_user }}"
  nextcloud_app:
    name: "{{ item }}"
    nextcloud_path: "{{ __nextcloud_install_dir }}"
    state: "enabled"
  register: __nextcloud_app_installed
  retries: 3
  delay: 3
  until: __nextcloud_app_installed is not failed
  with_items: "{{ nextcloud_custom_apps }}"

- name: "Nextcloud configure: get global preferences"
  ansible.builtin.command: php occ config:list --private --output=json
  args:
    chdir: "{{ __nextcloud_install_dir }}"
  register: __nextcloud_preferences
  changed_when: False
  check_mode: False
  no_log: True
  become: True
  become_user: "{{ nextcloud_http_user }}"

- name: "Nextcloud configure: parse global preferences as json"
  ansible.builtin.set_fact:
    __nextcloud_old_preferences: "{{ __nextcloud_preferences.stdout | from_json }}"
  no_log: True

- name: "Nextcloud configure: merge system configuration and collect app settings"
  ansible.builtin.set_fact:
    __nextcloud_old_system: "{{ __nextcloud_old_preferences.system | default({}) }}"
    __nextcloud_updated_system: >-
      {{
        __nextcloud_old_preferences.system | default({})
        | combine(nextcloud_config.system | default({}, true), recursive=True)
      }}
    # Flatten nextcloud_config.apps into a list of {app, key, value, changed}.
    # `value` is the string passed to `occ config:app:set` (None means delete).
    # Values are compared as strings, since `config:list` returns typed keys
    # as JSON booleans/integers and untyped ones as strings.
    __nextcloud_app_settings: >-
      {%- set ns = namespace(settings=[]) -%}
      {%- for app, keys in (nextcloud_config.apps | default({}, true)).items() -%}
      {%-   set current = (__nextcloud_old_preferences.apps | default({}, true)).get(app) or {} -%}
      {%-   for key, value in (keys or {}).items() -%}
      {%-     if value is none -%}
      {%-       set arg = none -%}
      {%-       set changed = key in current -%}
      {%-     else -%}
      {%-       set arg = (value | ternary('true', 'false')) if value is boolean else (value | string) -%}
      {%-       if key not in current -%}
      {%-         set changed = true -%}
      {%-       elif current[key] is boolean -%}
      {%-         set changed = (arg | lower) not in (['true', '1', 'on', 'yes'] if current[key] else ['false', '0', 'off', 'no']) -%}
      {%-       else -%}
      {%-         set changed = (current[key] | string) != arg -%}
      {%-       endif -%}
      {%-     endif -%}
      {%-     set ns.settings = ns.settings + [{'app': app, 'key': key, 'value': arg, 'changed': changed}] -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ ns.settings }}
  no_log: True

- name: "Nextcloud configure: Get Nextcloud instanceid"
  ansible.builtin.set_fact:
    __nextcloud_instanceid: "{{ __nextcloud_old_preferences.system.instanceid }}"
  changed_when: False
  check_mode: False
  no_log: True

- name: "Nextcloud configure: Assert we have an instance id"
  ansible.builtin.assert:
    that: __nextcloud_instanceid | length > 0

- name: "Nextcloud configure: configure nextcloud system"
  when: __nextcloud_updated_system != __nextcloud_old_system
  block:
    - name: "Nextcloud configure: create temporary config file"
      ansible.builtin.tempfile:
        suffix: nextcloud
      register: __nextcloud_preferences
      check_mode: False

    # Only system config goes through config:import. It rejects booleans for
    # app config and conflicts with app keys that have a strict type.
    - name: "Nextcloud configure: save config to file"
      ansible.builtin.copy:
        content: "{{ {'system': nextcloud_config.system} | to_json }}"
        dest: "{{ __nextcloud_preferences.path }}"
        owner: "{{ nextcloud_http_user }}"
        group: "{{ nextcloud_http_group }}"
        mode: 0o400
      no_log: True
      check_mode: False

    - name: "Nextcloud configure: create temporary config diff file"
      ansible.builtin.tempfile:
        suffix: nextcloud
      register: __nextcloud_preferences_diff
      check_mode: False

    - name: "Nextcloud configure: save config to diff file"
      ansible.builtin.copy:
        content: "{{ __nextcloud_old_system | to_nice_yaml }}"
        dest: "{{ __nextcloud_preferences_diff.path }}"
        owner: "{{ nextcloud_http_user }}"
        group: "{{ nextcloud_http_group }}"
        mode: 0o400
      no_log: True
      check_mode: False

    - name: "Nextcloud configure: save updated config to file"
      ansible.builtin.copy:
        content: "{{ __nextcloud_updated_system | to_nice_yaml }}"
        dest: "{{ __nextcloud_preferences_diff.path }}"
        owner: "{{ nextcloud_http_user }}"
        group: "{{ nextcloud_http_group }}"
        mode: 0o400
      check_mode: True

    - name: "Nextcloud configure: set up system preferences"
      ansible.builtin.command: php occ config:import "{{ __nextcloud_preferences.path }}"
      args:
        chdir: "{{ __nextcloud_install_dir }}"
      become: True
      become_user: "{{ nextcloud_http_user }}"
      register: __nextcloud_result
      changed_when: __nextcloud_result is success
      # TODO: we should switch to an htaccess handler as well
      # notify: nextcloud update htaccess
      failed_when: (__nextcloud_result.stdout is not search('successfully imported')
        or __nextcloud_result is failed)

    - name: "Nextcloud configure: delete temporary config files"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "{{ __nextcloud_preferences.path }}"
        - "{{ __nextcloud_preferences_diff.path }}"
      check_mode: False

# Without --type, config:app:set keeps the type Nextcloud has stored (or
# defined in the app's config lexicon) for the key, so typed keys don't conflict.
- name: "Nextcloud configure: set app preferences"
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:app:set
      - --no-interaction
      - "{{ item.app }}"
      - "{{ item.key }}"
      - "--value={{ item.value }}"
  args:
    chdir: "{{ __nextcloud_install_dir }}"
  become: True
  become_user: "{{ nextcloud_http_user }}"
  changed_when: True
  loop: "{{ __nextcloud_app_settings | selectattr('changed') | rejectattr('value', 'none') | list }}"
  loop_control:
    label: "{{ item.app }} {{ item.key }}"

- name: "Nextcloud configure: delete app preferences"
  ansible.builtin.command:
    argv:
      - php
      - occ
      - config:app:delete
      - "{{ item.app }}"
      - "{{ item.key }}"
  args:
    chdir: "{{ __nextcloud_install_dir }}"
  become: True
  become_user: "{{ nextcloud_http_user }}"
  changed_when: True
  loop: "{{ __nextcloud_app_settings | selectattr('changed') | selectattr('value', 'none') | list }}"
  loop_control:
    label: "{{ item.app }} {{ item.key }}"

# the theming app is not compatible with using the old theming way above
- name: Copy images for theming app
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ nextcloud_data_dir }}/appdata_{{ __nextcloud_instanceid }}/theming/images/"
    owner: "{{ nextcloud_http_user }}"
    group: "{{ nextcloud_http_group }}"
    mode: 0644
  with_fileglob:
    - "nextcloud/theming/images/{{ ansible_fqdn }}/*"
    - "nextcloud/theming/images/*"
  # nextcloud supports the following files
  # - background
  # - favicon
  # - logo
  # - logoheader

- name: "Run additional configuration commands"
  ansible.builtin.command: "{{ item }}"
  args:
    chdir: "{{ __nextcloud_install_dir }}"
  become: True
  become_user: "{{ nextcloud_http_user }}"
  changed_when: False
  with_items:
    - "{{ nextcloud_configure_additional_commands }}"
  when:
    - nextcloud_configure_additional_commands is defined
